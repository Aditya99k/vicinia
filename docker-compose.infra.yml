# Local/dev infra for Vicinia — Postgres, Redis, Redpanda (Kafka-protocol-
# compatible), and MongoDB.
#
# MongoDB here is a *local dev* choice, distinct from DEPLOYMENT.md's
# documented deployed state (Atlas M0, even for local dev — §3). Standing
# up a real Atlas cluster is explicitly a Stage 20 task in
# docs/BUILD_TRACKER.md, not a Stage 4 one — self-hosting it here for now
# avoids blocking catalog-service's build on an external account signup
# that was never meant to happen until deployment anyway. Switching to
# Atlas later is a one-line .env change (MONGODB_URI) with zero code
# changes — see catalog-service's application.yml.
#
# Credentials come from .env (gitignored) — Compose loads it automatically
# since it sits next to this file. See .env.example for the template.
#
# Usage: docker compose -f docker-compose.infra.yml up -d

services:
  postgres:
    image: postgres:16-alpine
    container_name: vicinia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - vicinia-postgres-data:/var/lib/postgresql/data
      - ./backend/docker/postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vicinia"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: vicinia-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - vicinia-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: vicinia-redis-commander
    restart: unless-stopped
    environment:
      REDIS_HOSTS: local:redis:6379
    ports:
      - "9191:8081"
    depends_on:
      - redis

  redpanda:
    image: redpandadata/redpanda:v24.2.7
    container_name: vicinia-redpanda
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=500M
      - --reserve-memory=0M
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      # Advertises localhost because every service currently runs on the
      # host via `mvn spring-boot:run` (docker-compose.infra.yml only runs
      # the data layer, per BUILD_TRACKER.md's stage order) and a Kafka
      # client always reconnects using whatever address the broker
      # advertises, not the one it originally dialed. This has to change to
      # redpanda:9092 once app services run as containers on this same
      # Docker network (docker-compose.prod.yml, Stage 19) — see
      # study/2026-08-20-infra-fundamentals.html §5.4 for why the two
      # addresses can differ at all.
      - --advertise-kafka-addr=PLAINTEXT://localhost:9092
      - --pandaproxy-addr=PLAINTEXT://0.0.0.0:8082
      - --advertise-pandaproxy-addr=PLAINTEXT://redpanda:8082
      - --schema-registry-addr=PLAINTEXT://0.0.0.0:8081
    ports:
      - "9092:9092"
      # Host-side only — container-internal pandaproxy/schema-registry stay
      # on 8081/8082 (matches the --*-addr flags above and redpanda-console's
      # internal access), but those host ports collide with auth-service
      # (8081) and user-service (8082) once Stage 2 stands them up. Nothing
      # outside this machine needs pandaproxy/schema-registry anyway.
      - "18081:8081"
      - "18082:8082"
    volumes:
      - vicinia-redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 10s
      timeout: 5s
      retries: 10

  redpanda-console:
    image: redpandadata/console:v2.7.2
    container_name: vicinia-redpanda-console
    restart: unless-stopped
    environment:
      KAFKA_BROKERS: redpanda:9092
    ports:
      - "9093:8080"
    depends_on:
      - redpanda

  mongo:
    image: mongo:7
    container_name: vicinia-mongo
    restart: unless-stopped
    # No auth locally — same posture as the self-hosted Redis, not exposed
    # beyond localhost. Swap for a real Atlas connection string via
    # MONGODB_URI when this stops being purely local dev (Stage 20).
    ports:
      - "27017:27017"
    volumes:
      - vicinia-mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  vicinia-postgres-data:
  vicinia-redis-data:
  vicinia-redpanda-data:
  vicinia-mongo-data:
