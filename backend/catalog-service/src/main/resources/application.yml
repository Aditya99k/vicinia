server:
  port: 8084

spring:
  application:
    name: catalog-service
  config:
    import: optional:configserver:http://localhost:8888

  data:
    mongodb:
      # Self-hosted locally for dev (docker-compose.infra.yml) — DEPLOYMENT.md's
      # documented final state is Atlas M0 even for local dev, but Atlas setup
      # is explicitly a Stage 20 task in BUILD_TRACKER.md, not Stage 4. This
      # env var is how that switch happens later with zero code changes:
      # set MONGODB_URI in .env to a real Atlas connection string and this
      # default is never used.
      uri: ${MONGODB_URI:mongodb://localhost:27017/catalog_db}
      # Stage 17: off by default in Spring Data MongoDB, which means
      # Category's @Indexed(unique = true) on name/slug (Stage 4) has
      # never actually been enforced at the database level — a real,
      # latent bug sitting unnoticed since Stage 4, caught only once a
      # genuine integration test (Testcontainers Mongo) tried to prove
      # the constraint held and found it didn't. review-service got this
      # exact fix in Stage 13 for the same underlying reason; catalog-
      # service was simply never revisited until this stage's testing
      # pass actually exercised the index.
      auto-index-creation: true

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
        # Stage 16: copies the current request's correlation ID (MDC) onto
        # every outgoing record as a real Kafka header -- no publisher code
        # changes needed anywhere.
        interceptor.classes: com.vicinia.common.observability.CorrelationIdProducerInterceptor

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

vicinia:
  # Merchant product-image uploads (Stage 18) go straight from the browser
  # to Cloudinary, signed here — see CloudinaryService. Free-tier signup at
  # https://cloudinary.com; empty defaults mean uploads simply fail closed
  # (a real error from Cloudinary's own API, not a startup crash) until
  # these are set in .env.
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}
