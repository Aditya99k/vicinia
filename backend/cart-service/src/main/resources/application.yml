server:
  port: 8086

spring:
  application:
    name: cart-service
  config:
    import: optional:configserver:http://localhost:8888
  data:
    redis:
      host: localhost
      port: 6379

  kafka:
    bootstrap-servers: localhost:9092
    # This service never published anything of its own until Stage 10 —
    # @RetryableTopic republishes a failed message to its retry/DLT topics
    # internally, which needs a real producer. Without this block, Spring
    # Boot's autoconfigured KafkaTemplate defaults to a plain StringSerializer,
    # and republishing a deserialized OrderEventEnvelope object through it
    # throws ClassCastException — found by actually triggering the DLQ test,
    # not by inspection (see BUILD_TRACKER.md Stage 10's notes).
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
    consumer:
      group-id: cart-service
      # Deliberately the default (latest), not earliest like inventory-service/
      # payment-service's read-model backfills — there's no useful action to
      # take on an order.confirmed from before this consumer existed. A cart's
      # current contents reflect today, not what was in it when some old order
      # was placed; "catching up" on stale confirmations could even clear a
      # cart that's since been filled with unrelated new items.
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.vicinia.cartservice.messaging
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.vicinia.cartservice.messaging.OrderEventEnvelope

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

vicinia:
  cart:
    # ARCHITECTURE.md §12: cart:{userId}, 7 days rolling. Reset on every
    # write (add/update/remove), not on a plain read — see CartRepository.
    ttl-days: 7
