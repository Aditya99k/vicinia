server:
  port: 8086

spring:
  application:
    name: cart-service
  config:
    import: optional:configserver:http://localhost:8888
  data:
    redis:
      host: localhost
      port: 6379

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

vicinia:
  cart:
    # ARCHITECTURE.md §12: cart:{userId}, 7 days rolling. Reset on every
    # write (add/update/remove), not on a plain read — see CartRepository.
    ttl-days: 7
