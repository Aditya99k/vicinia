server:
  port: 8761

spring:
  application:
    name: discovery-server

eureka:
  client:
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: http://localhost:8761/eureka/
  server:
    # dev-friendly: don't wait the default 90s eviction window when a
    # service on a laptop is restarted mid-development
    enable-self-preservation: false
    eviction-interval-timer-in-ms: 5000

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}

# Doesn't import from config-server (chicken-and-egg — this IS the
# registry config-server itself registers with), so the shared logging
# pattern override lives here too, duplicated rather than imported.
logging:
  pattern:
    level: "%5p [${spring.application.name},%X{correlationId:-}]"
