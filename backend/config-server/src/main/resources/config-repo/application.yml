# Shared config served to every service that imports from config-server
# (spring.config.import: optional:configserver:...). Per-service overrides
# go in {spring.application.name}.yml alongside this file, added as each
# service is scaffolded per BUILD_TRACKER.md's stage order.

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        # prometheus added Stage 16 — this remote source takes precedence
        # over each service's own local application.yml (learned the hard
        # way in Stage 15: see order-service.yml for why a truly
        # per-service-only exposure addition has to go in its own override
        # file instead of trying to widen this list locally).
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      # Every metric Prometheus scrapes needs this to tell one service's
      # request-latency/JVM numbers apart from another's — without it,
      # e.g. http_server_requests_seconds from all 16 services would be
      # indistinguishable in a single Prometheus instance.
      application: ${spring.application.name}

# Stage 16 (ARCHITECTURE.md §15) — embeds the service name and the current
# request's correlation ID (from MDC, via CorrelationIdFilter) right next
# to the log level on every line, in every service, without redefining
# Spring Boot's whole console pattern. logging.pattern.level is the one
# piece of the default CONSOLE_LOG_PATTERN meant for exactly this kind of
# override.
logging:
  pattern:
    level: "%5p [${spring.application.name},%X{correlationId:-}]"

# --- Shared secrets (ARCHITECTURE.md §14 / ADR 0008) ---------------------
# Values come from environment variables, not literals — see .env.example
# at the repo root. Config Server serves this ${...} placeholder as a raw
# string to whichever service asks for it; that service's OWN JVM
# environment (its own OS env vars, exported by start-infra.sh from .env)
# is what actually resolves it, at the point something does
# @Value("${vicinia.jwt.secret}") — Config Server itself never needs
# these values and never resolves them itself.
#
# A real secrets manager is an explicit Stage 20 deployment concern, not
# designed before there's a deployment target — env vars are the correct
# local-dev answer for now.
vicinia:
  # Shared by every domain service's InternalRequestFilter and by
  # api-gateway, which stamps this header on every proxied request —
  # a request that skips the gateway won't carry it and gets rejected.
  internal-secret: ${VICINIA_INTERNAL_SECRET}
  jwt:
    # Shared by auth-service (issues access tokens) and api-gateway
    # (verifies them) — see common's JwtTokenProvider.
    secret: ${VICINIA_JWT_SECRET}
    access-token-ttl-minutes: 15
