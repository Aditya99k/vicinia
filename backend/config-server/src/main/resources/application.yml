server:
  port: 8888

spring:
  application:
    name: config-server
  profiles:
    active: native
  cloud:
    config:
      server:
        native:
          # config-repo/ holds shared application.yml + one {service-name}.yml
          # per domain service, added as each service is scaffolded.
          search-locations: classpath:/config-repo

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
