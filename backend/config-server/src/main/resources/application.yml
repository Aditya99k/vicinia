server:
  port: 8888

spring:
  application:
    name: config-server
  profiles:
    active: native
  cloud:
    config:
      server:
        native:
          # config-repo/ holds shared application.yml + one {service-name}.yml
          # per domain service, added as each service is scaffolded.
          search-locations: classpath:/config-repo

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}

# Can't import from itself (it's the thing serving remote config to
# everyone else), so the shared logging pattern lives here too.
logging:
  pattern:
    level: "%5p [${spring.application.name},%X{correlationId:-}]"
