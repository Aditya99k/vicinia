server:
  port: 8083

spring:
  application:
    name: merchant-service
  config:
    import: optional:configserver:http://localhost:8888

  datasource:
    url: jdbc:postgresql://localhost:5432/merchant_db
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
    consumer:
      # First consumer this service has — order.confirmed, to create an
      # order task for the owning merchant to accept/reject (Stage 11,
      # pulled forward — see BUILD_TRACKER.md's notes). Deliberately
      # latest, not earliest — same reasoning as cart-service's own
      # order.confirmed consumer (Stage 8/10): there's no useful action on
      # a stale historical order.confirmed from before this consumer
      # existed, and the orders confirmed during Stages 8-10's testing were
      # never meant to be accepted/prepared for real.
      group-id: merchant-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.vicinia.merchantservice.messaging
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.vicinia.merchantservice.messaging.OrderEventEnvelope

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
