server:
  port: 8089

spring:
  application:
    name: order-service
  config:
    import: optional:configserver:http://localhost:8888

  datasource:
    url: jdbc:postgresql://localhost:5432/order_db
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
        # Stage 16: copies the current request's correlation ID (MDC) onto
        # every outgoing record as a real Kafka header -- no publisher code
        # changes needed anywhere.
        interceptor.classes: com.vicinia.common.observability.CorrelationIdProducerInterceptor
    consumer:
      # Stage 9's first order-service consumer: payment-events, for the
      # Razorpay path specifically (wallet stays synchronous, unaffected —
      # see PaymentEventConsumer). Deliberately latest, not earliest — same
      # reasoning as cart-service's order.confirmed consumer: any
      # historical payment.success/failed either already resolved that
      # order (idempotent no-op via the PAYMENT_PENDING status guard) or
      # was wallet-originated (filtered out by method), so there's no real
      # catch-up value in replaying Stage 8's backlog.
      group-id: order-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.vicinia.orderservice.messaging
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.vicinia.orderservice.messaging.PaymentEventEnvelope

management:
  endpoints:
    web:
      exposure:
        # circuitbreakers/circuitbreakerevents added for Stage 15 — the
        # only way to observe the razorpay circuit's actual state
        # (CLOSED/OPEN/HALF_OPEN) and event history from outside the JVM,
        # used directly during this stage's own verification.
        include: health,info,circuitbreakers,circuitbreakerevents
  endpoint:
    health:
      show-details: always

# Resilience4j (Stage 15, ARCHITECTURE.md §12) — scoped to the "razorpay"
# instance only, matching the checklist's own scoping: "Circuit breaker:
# order-service -> payment-service (Razorpay path)" specifically, not
# every outbound call. payWithWallet/reserve get @Retryable (Spring
# Retry, configured inline via annotation attributes) instead — see
# InventoryClient/PaymentClient's own comments for why retry and
# circuit-breaker+bulkhead were split across the two different libraries
# already present in this project rather than picking one for everything.
resilience4j:
  circuitbreaker:
    instances:
      razorpay:
        register-health-indicator: true
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
  bulkhead:
    instances:
      razorpay:
        # Semaphore (default type), not thread-pool — see PaymentClient's
        # comment. Fails fast (0 wait) rather than queuing once full, since
        # queuing would just delay the same thread-starvation risk instead
        # of preventing it.
        max-concurrent-calls: 10
        max-wait-duration: 0

vicinia:
  observability:
    # Stage 16's "stale READY_FOR_PICKUP orders" gauge (ARCHITECTURE.md
    # §15) — how long an order can sit waiting for a delivery partner
    # before it counts as stale on the dashboard.
    stale-ready-for-pickup-minutes: 15
