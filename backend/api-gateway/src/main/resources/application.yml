server:
  port: 8080

spring:
  application:
    name: api-gateway
  config:
    import: optional:configserver:http://localhost:8888
  data:
    redis:
      host: localhost
      port: 6379
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false
      # Per-user (or per-IP, pre-auth) token bucket, applied to every route
      # (Stage 15, ARCHITECTURE.md §12) — a default-filter, not attached to
      # individual routes one at a time, since abuse protection should
      # cover the whole surface by default rather than needing to be
      # remembered on each new route as services get added. Backed by
      # Spring Cloud Gateway's built-in RedisRateLimiter (auto-configured
      # from the existing spring-boot-starter-data-redis dependency — no
      # new dependency needed) and RateLimiterConfig's userKeyResolver
      # bean. 20 req/s sustained, bursting to 40 — generous for normal
      # browsing/checkout traffic, low enough to blunt scripted abuse.
      default-filters:
        - name: RequestRateLimiter
          args:
            redis-rate-limiter.replenishRate: 20
            redis-rate-limiter.burstCapacity: 40
            redis-rate-limiter.requestedTokens: 1
            key-resolver: "#{@userKeyResolver}"
      # Local dev only — lets frontend/customer-app (Vite on :5173) call the
      # gateway from the browser. A real deployment locks this down to the
      # actual frontend origin (Cloudflare Pages URL), per DEPLOYMENT.md.
      #
      # allowedOriginPatterns (not allowedOrigins) with a "*" host wildcard,
      # not a fixed IP list — the browser sends whatever Origin the page
      # was actually loaded from (localhost on a PC, whatever LAN IP a
      # phone is on), and that changes every time the Mac switches Wi-Fi
      # networks. Matching any host on :5173 means this never needs
      # updating again; unlike allowedOrigins: "*", allowedOriginPatterns
      # still reflects back the specific matched origin (not a literal
      # "*"), so it's valid to combine with allowCredentials: true.
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns:
              - "http://*:5173"
              # Stage 20: the frontend's production home (docs/DEPLOYMENT.md
              # §4) — *.pages.dev covers whatever exact subdomain Cloudflare
              # Pages assigns the project without needing to know it ahead
              # of time. A later custom domain is a one-line addition here.
              - "https://*.pages.dev"
              # Cloudflare Quick Tunnels (no account needed) always land on
              # this domain with a random subdomain per run — used as an
              # interim public URL while Stage 20's real VM is blocked.
              - "https://*.trycloudflare.com"
              # The frontend's actual home now — Vercel, chosen over
              # Cloudflare Pages for this deploy. *.vercel.app covers both
              # the production URL and every preview-deploy URL Vercel
              # generates per branch/PR.
              - "https://*.vercel.app"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
            allowCredentials: true
      routes:
        # Skeleton routes for all 13 domain services (Stage 1 — no filters,
        # no auth/rate-limiting yet, added in Stage 2 and Stage 15).
        # lb:// resolves the service ID via Eureka once each service exists
        # and registers under this exact spring.application.name.
        - id: auth-service
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/api/auth/**
        - id: user-service
          uri: lb://USER-SERVICE
          predicates:
            - Path=/api/users/**
        - id: merchant-service
          uri: lb://MERCHANT-SERVICE
          predicates:
            - Path=/api/merchants/**
        - id: catalog-service
          uri: lb://CATALOG-SERVICE
          predicates:
            - Path=/api/catalog/**
        - id: inventory-service
          uri: lb://INVENTORY-SERVICE
          predicates:
            - Path=/api/inventory/**
        - id: cart-service
          uri: lb://CART-SERVICE
          predicates:
            - Path=/api/cart/**
        - id: coupon-service
          uri: lb://COUPON-SERVICE
          predicates:
            - Path=/api/coupons/**
        - id: order-service
          uri: lb://ORDER-SERVICE
          predicates:
            - Path=/api/orders/**
        - id: payment-service
          uri: lb://PAYMENT-SERVICE
          predicates:
            - Path=/api/payments/**
        - id: delivery-service
          uri: lb://DELIVERY-SERVICE
          predicates:
            - Path=/api/delivery/**
        - id: notification-service
          uri: lb://NOTIFICATION-SERVICE
          predicates:
            - Path=/api/notifications/**
        - id: review-service
          uri: lb://REVIEW-SERVICE
          predicates:
            - Path=/api/reviews/**
        - id: settlement-service
          uri: lb://SETTLEMENT-SERVICE
          predicates:
            - Path=/api/settlements/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

# Paths that do NOT require a validated JWT (ARCHITECTURE.md §14 — every
# other route trusts X-User-Id injected by the gateway from a validated
# token, never a client-supplied one). This list was a placeholder guess
# made in Stage 1 before catalog-service's real endpoint shape existed —
# /api/catalog/** was too broad, since it would have also exempted
# product-creation-requests and admin moderation, which need auth. Narrowed
# in Stage 4 to just the two actually-public browse endpoints.
vicinia:
  gateway:
    public-paths:
      - /api/auth/signup
      - /api/auth/login
      - /api/auth/refresh
      - /api/auth/forgot-password
      - /api/auth/reset-password
      - /api/catalog/products/search
      - /api/catalog/categories
      - /api/merchants/nearby
      - /api/inventory/listings/product/*
      - /api/inventory/listings/merchant/*
      - /api/reviews/products/**
      # Razorpay's own servers call this, not a logged-in user — it will
      # never carry a JWT. Security here is entirely the HMAC-SHA256
      # signature check in payment-service's RazorpayPaymentService, not
      # gateway auth. The gateway still unconditionally stamps
      # X-Internal-Secret on every proxied request regardless of
      # public/private path, so this passes InternalRequestFilter with no
      # changes needed there — see RazorpayWebhookController's comment.
      - /api/payments/razorpay/webhook

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      show-details: always
