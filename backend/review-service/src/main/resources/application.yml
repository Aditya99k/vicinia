server:
  port: 8092

spring:
  application:
    name: review-service
  config:
    import: optional:configserver:http://localhost:8888

  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/review_db}
      # Off by default in Spring Data MongoDB — the compound unique index on
      # (userId, productId) is the real enforcement behind the duplicate-review
      # guard (ReviewService catches DuplicateKeyException), not just
      # documentation, so it has to actually get created.
      auto-index-creation: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
