# Static scrape config, not Eureka service discovery, even though Eureka
# is already in the stack (prefer-ip-address: true) — every app service
# runs on the HOST via `mvn spring-boot:run` (docker-compose.infra.yml
# only runs the data layer, see its own top comment), so Prometheus,
# running inside this compose network, has to reach them at
# host.docker.internal:<port> regardless of what Eureka SD would resolve
# instance addresses to. One static list of 16 known ports is simpler and
# more deterministic than teaching Prometheus to translate Eureka
# addresses through the same host-vs-container boundary — "boring but
# reliable," same call as the DB-polling reapers elsewhere in this
# project over a fancier event-driven alternative.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: services
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - host.docker.internal:8761
        labels:
          service: discovery-server
      - targets:
          - host.docker.internal:8888
        labels:
          service: config-server
      - targets:
          - host.docker.internal:8080
        labels:
          service: api-gateway
      - targets:
          - host.docker.internal:8081
        labels:
          service: auth-service
      - targets:
          - host.docker.internal:8082
        labels:
          service: user-service
      - targets:
          - host.docker.internal:8083
        labels:
          service: merchant-service
      - targets:
          - host.docker.internal:8084
        labels:
          service: catalog-service
      - targets:
          - host.docker.internal:8085
        labels:
          service: inventory-service
      - targets:
          - host.docker.internal:8086
        labels:
          service: cart-service
      - targets:
          - host.docker.internal:8087
        labels:
          service: coupon-service
      - targets:
          - host.docker.internal:8088
        labels:
          service: payment-service
      - targets:
          - host.docker.internal:8089
        labels:
          service: order-service
      - targets:
          - host.docker.internal:8090
        labels:
          service: delivery-service
      - targets:
          - host.docker.internal:8091
        labels:
          service: notification-service
      - targets:
          - host.docker.internal:8092
        labels:
          service: review-service
      - targets:
          - host.docker.internal:8093
        labels:
          service: settlement-service
