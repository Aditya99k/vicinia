server:
  port: 8088

spring:
  application:
    name: payment-service
  config:
    import: optional:configserver:http://localhost:8888

  datasource:
    url: jdbc:postgresql://localhost:5432/payment_db
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
        # Stage 16: copies the current request's correlation ID (MDC) onto
        # every outgoing record as a real Kafka header -- no publisher code
        # changes needed anywhere.
        interceptor.classes: com.vicinia.common.observability.CorrelationIdProducerInterceptor
    consumer:
      # Consumes both user-events (wallet auto-provisioning on user.registered)
      # and order-events (refund on order.cancelled) — earliest so the
      # user.registered backfill picks up every user that already existed
      # before this service did, same as inventory-service's product.created
      # backfill in Stage 5.
      group-id: payment-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.vicinia.paymentservice.messaging
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.vicinia.paymentservice.messaging.PlatformEventEnvelope

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

vicinia:
  razorpay:
    key-id: ${RAZORPAY_KEY_ID:}
    key-secret: ${RAZORPAY_KEY_SECRET:}
    webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
